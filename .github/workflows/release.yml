# Every PR builds the Chrome, Firefox and Safari packages so you can download and test them.
# Pushing a tag like v3.1 also checks it matches the manifest and publishes them as a Release.
name: release
on:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest   # Safari builds need Xcode
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bae-packages
          path: dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
